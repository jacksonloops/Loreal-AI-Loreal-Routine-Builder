<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>L'Oréal | Smart Routine &amp; Product Advisor</title>
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="page-wrapper">
      <!------- Header / Branding ------->
      <header class="site-header">
        <div class="header-bar">
          <img
            src="img/loreal-logo.png"
            alt="L'Oréal Paris"
            class="header-logo"
          />
        </div>
      </header>

      <main>
        <!------- Intro ------->
        <div class="chat-intro">
          <h1 class="chatbot-name">Oré</h1>
          <p class="chatbot-tagline">Smart Routine &amp; Product Advisor</p>
        </div>

        <!-- Filters: search + category -->
        <div class="search-section">
          <div class="search-field">
            <span class="material-icons search-icon" aria-hidden="true"
              >search</span
            >
            <input
              id="productSearch"
              type="text"
              placeholder="Search products by name, brand, or keyword…"
              autocomplete="off"
              aria-label="Search products"
            />
            <button
              type="button"
              id="clearSearchBtn"
              class="clear-search-btn"
              aria-label="Clear search"
              hidden
            >
              <span class="material-icons">close</span>
            </button>
          </div>
          <select id="categoryFilter">
            <option value="" disabled selected>Choose a Category</option>
            <option value="all">All Products</option>
            <option value="cleanser">Cleansers</option>
            <option value="moisturizer">Moisturizers &amp; Treatments</option>
            <option value="skincare">Skincare</option>
            <option value="haircare">Haircare</option>
            <option value="makeup">Makeup</option>
            <option value="hair color">Hair Color</option>
            <option value="hair styling">Hair Styling</option>
            <option value="men's grooming">Men's Grooming</option>
            <option value="suncare">Suncare</option>
            <option value="fragrance">Fragrance</option>
          </select>
        </div>

        <!-- Products Grid -->
        <div id="productsContainer" class="products-grid"></div>

        <!-- Show More / Less -->
        <div id="expandControl" class="expand-control" hidden>
          <button id="expandBtn" type="button" class="expand-btn">
            <span id="expandBtnLabel">View More</span>
            <span class="material-icons" id="expandBtnIcon">expand_more</span>
          </button>
        </div>

        <!-- Selected Products -->
        <section class="selected-products">
          <div class="selected-header">
            <h2>Your Selections</h2>
            <button id="clearSelections" type="button" class="clear-btn" hidden>
              Clear All
            </button>
          </div>
          <div id="selectedProductsList" class="selected-list"></div>
          <button id="generateRoutine" type="button" class="generate-btn">
            <span class="material-icons">auto_awesome</span>
            Generate Routine
          </button>
        </section>

        <!------- Chat Area ------->
        <section class="chatbox">
          <div id="chatWindow" class="chat-window">
            <!-- messages will be appended here via JS -->
          </div>

          <form id="chatForm" class="chat-form">
            <label for="userInput" class="visually-hidden">Message</label>
            <input
              id="userInput"
              name="userInput"
              type="text"
              placeholder="Ask me about products or routines…"
              autocomplete="off"
              required
            />
            <button type="submit" id="sendBtn">
              <span class="material-icons">send</span>
              <span class="visually-hidden">Send</span>
            </button>
          </form>
        </section>
      </main>

      <!------- Footer Links ------->
      <footer class="site-footer">
        <p>&copy; 2025 L'Oréal Paris. All rights reserved.</p>
        <nav>
          <a href="#">Privacy Policy</a>
          <a href="#">Terms of Use</a>
          <a href="#">Contact</a>
        </nav>
      </footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
